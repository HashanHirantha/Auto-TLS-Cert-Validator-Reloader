apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: certreloader-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: certreloader-role
subjects:
  - kind: ServiceAccount
    name: certreloader-controller-manager
    namespace: certreloader-system
