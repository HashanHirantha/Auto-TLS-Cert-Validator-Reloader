---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tlscertwatches.tls.certreloader.io
spec:
  group: tls.certreloader.io
  names:
    kind: TLSCertWatch
    listKind: TLSCertWatchList
    plural: tlscertwatches
    shortNames:
    - tcw
    singular: tlscertwatch
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.certificateSubject
      name: Certificate
      type: string
    - jsonPath: .status.conditions[?(@.type=="CertificateValid")].status
      name: Valid
      type: string
    - jsonPath: .status.certificateExpiry
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TLSCertWatch is the Schema for the tlscertwatches API.
          It watches a TLS certificate stored in a Secret or ConfigMap and triggers
          rolling restarts of target workloads when the certificate changes or becomes invalid.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TLSCertWatchSpec defines the desired state of TLSCertWatch.
            properties:
              certificateRef:
                description: CertificateRef points to the Secret or ConfigMap containing
                  the TLS certificate.
                properties:
                  caKey:
                    description: CAKey is the optional key holding the CA bundle PEM.
                    type: string
                  certKey:
                    default: tls.crt
                    description: CertKey is the key within the Secret/ConfigMap holding
                      the certificate PEM.
                    type: string
                  keyKey:
                    default: tls.key
                    description: KeyKey is the key within the Secret/ConfigMap holding
                      the private key PEM.
                    type: string
                  kind:
                    default: Secret
                    description: 'Kind is the Kubernetes resource type: "Secret" or
                      "ConfigMap".'
                    enum:
                    - Secret
                    - ConfigMap
                    type: string
                  name:
                    description: Name of the Secret or ConfigMap.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the Secret or ConfigMap. Defaults to
                      the CR namespace.
                    type: string
                required:
                - kind
                - name
                type: object
              checkIntervalMinutes:
                default: 60
                description: |-
                  CheckIntervalMinutes defines how often (in minutes) to re-validate the certificate
                  in addition to watch-based triggers.
                minimum: 1
                type: integer
              paused:
                description: Paused suspends reconciliation when set to true.
                type: boolean
              reloadStrategy:
                default: RollingRestart
                description: ReloadStrategy defines how workload restarts are triggered.
                enum:
                - RollingRestart
                - Annotation
                type: string
              targets:
                description: Targets lists the workloads to reload when the certificate
                  changes or becomes invalid.
                items:
                  description: TargetRef identifies a workload to reload when certificate
                    changes are detected.
                  properties:
                    kind:
                      description: Kind of the target workload.
                      enum:
                      - Deployment
                      - StatefulSet
                      - DaemonSet
                      type: string
                    name:
                      description: Name of the target workload.
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace of the target workload. Defaults to the
                        CR namespace.
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                minItems: 1
                type: array
              validation:
                description: Validation configures certificate validation behavior.
                properties:
                  checkChain:
                    default: true
                    description: CheckChain enables full certificate chain verification.
                    type: boolean
                  checkExpiry:
                    default: true
                    description: CheckExpiry enables expiry threshold checking.
                    type: boolean
                  checkHostnames:
                    description: CheckHostnames is an optional list of hostnames to
                      verify against the cert SANs/CN.
                    items:
                      type: string
                    type: array
                  expiryThresholdDays:
                    default: 30
                    description: ExpiryThresholdDays is the number of days before
                      expiry to trigger a warning/reload.
                    minimum: 1
                    type: integer
                type: object
            required:
            - certificateRef
            - targets
            type: object
          status:
            description: TLSCertWatchStatus defines the observed state of TLSCertWatch.
            properties:
              certificateExpiry:
                description: CertificateExpiry is the expiration time of the certificate
                  (x509 NotAfter).
                format: date-time
                type: string
              certificateFingerprint:
                description: CertificateFingerprint is the SHA-256 fingerprint of
                  the certificate DER bytes.
                type: string
              certificateSANs:
                description: CertificateSANs lists the Subject Alternative Names from
                  the certificate.
                items:
                  type: string
                type: array
              certificateSubject:
                description: CertificateSubject is the Subject Common Name from the
                  certificate.
                type: string
              conditions:
                description: Conditions represent the latest available observations
                  of the resource's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastCheckedAt:
                description: LastCheckedAt is the timestamp of the last successful
                  validation check.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              targetStatuses:
                description: TargetStatuses tracks per-target reload state.
                items:
                  description: TargetReloadStatus tracks the reload state of a single
                    target workload.
                  properties:
                    kind:
                      description: Kind of the target workload.
                      type: string
                    lastReloadedAt:
                      description: LastReloadedAt is the timestamp of the last successful
                        reload.
                      format: date-time
                      type: string
                    name:
                      description: Name of the target workload.
                      type: string
                    namespace:
                      description: Namespace of the target workload.
                      type: string
                    reloadedForFingerprint:
                      description: ReloadedForFingerprint is the certificate fingerprint
                        that triggered the last reload.
                      type: string
                    upToDate:
                      description: UpToDate indicates whether this target has been
                        reloaded for the current certificate.
                      type: boolean
                  required:
                  - kind
                  - name
                  - namespace
                  - upToDate
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
