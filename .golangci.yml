linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - gofmt
    - goimports
    - misspell
    - unconvert
    - goconst
    - gosec
    - prealloc

linters-settings:
  govet:
    check-shadowing: true
  goimports:
    local-prefixes: github.com/HashanHirantha/auto-tls-certreloader
  gosec:
    excludes:
      - G101 # Potential hardcoded credentials (false positives on cert test data)

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - goconst
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  go: "1.22"
